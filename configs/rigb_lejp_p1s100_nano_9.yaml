# Training configuration of run rigb_lejp_p1s100_nano_9.
data:
  batch_size: 128
  calo_cfg:
    N_cells_x: 64
    N_cells_y: 64
    N_cells_z: 4
    N_spots_per_layer: 100
    Z: 82
    cell_e_threshold: 0.0
    depth: 20.0
    height: 10.0
    lejepa_latents:
      dist: gaussian
      rho: 1.0
      views: 2
    width: 10.0
  generator_cfg:
    E_range:
    - 20000.0
    - 40000.0
    N_range:
    - 1
    - 1
    kind: gun
    pad_value: .nan
    x_range:
    - 0.0
    - 0.0
    y_range:
    - 0.0
    - 0.0
  norm:
    mode: log1p_scale
    scale: 5500.0
  num_events: 64000
  num_workers: 0
  persistent_workers: true
  pin_mem: true
  sample_target: true
logging:
  run_name: rigb_lejp_p1s100_nano_9
  folder: runs
  write_tag: jepa
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 4
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  checkpoint_schedule:
  - - 20
    - 2
  - - 300
    - 10
  copy_data: false
  lejepa:
    lamb: 0.02
    masking: none
    monitor_slice_seed: 20260816
    n_points: 17
    num_slices: 256
    optimizer: house
    proj_dim: 16
    proj_hidden_dim: 2048
    t_max: 3
  load_checkpoint: false
  model_name: vit_nano
  objective: lejepa
  pred_depth: 3
  pred_emb_dim: 48
  read_checkpoint: null
  seed: 9
  use_bfloat16: true
optimization:
  epochs: 300
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
